<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My palette — The Perfume of Emotions</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../salon.css">
<link rel="stylesheet" href="../palette.css">
</head>
<body class="salon palette">

<header class="barre-salon">
  <div class="client">
    <strong style="font-size:19px">My palette</strong>
    <span id="resume-palette"></span>
  </div>
  <div class="actions">
    <a class="tactile discret" href="../palette.html" lang="fr" title="Version française">FR</a>
    <a class="tactile discret" href="./salon.html">Session</a>
    <a class="tactile discret" href="./index.html">Client page</a>
  </div>
</header>

<main>
  <p class="consigne" id="explication"></p>

  <div class="bandeau-outils" id="commandes">
    <button type="button" class="tactile pleine" id="ajouter">+ Add a material</button>
    <button type="button" class="tactile" id="depuis-liste">Paste my list</button>
    <button type="button" class="tactile" id="partir-demo">Start from the demonstration palette</button>
    <button type="button" class="tactile" id="exporter">Save / export</button>
    <button type="button" class="tactile" id="importer">Restore a backup</button>
    <button type="button" class="tactile" id="vider">Erase everything</button>
  </div>

  <div id="bilan"></div>

  <div class="filtres" id="filtres">
    <input type="search" id="recherche" placeholder="Search for a material…" autocomplete="off">
    <div class="chips" id="filtre-role"></div>
  </div>

  <div id="liste"></div>
</main>

<div class="voile masque" id="voile"><div class="panneau" id="panneau"></div></div>

<script src="./donnees.js"></script>
<script src="../stock.js"></script>
<script src="./moteur.js"></script>
<script src="../palette-locale.js"></script>
<script src="./palette-outils.js"></script>
<script src="./palette.js"></script>
</body>
</html>
