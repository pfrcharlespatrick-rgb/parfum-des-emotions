<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f3ee">
<title>Le Parfum des émotions — séance en salon</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./salon.css">
</head>
<body class="salon">

<header class="barre-salon">
  <div class="client">
    <input id="nom-client" type="text" placeholder="Nom du client" autocomplete="off">
    <span id="horodatage"></span>
  </div>
  <div class="actions">
    <a class="tactile discret" href="./palette.html">Palette</a>
    <button type="button" class="tactile discret" id="seances">Séances</button>
    <button type="button" class="tactile discret" id="nouvelle">Nouvelle</button>
  </div>
</header>

<nav class="jalons" id="jalons"></nav>

<main id="scene"></main>

<footer class="pied-nav">
  <button type="button" class="tactile" id="precedent">← Précédent</button>
  <span class="indication" id="indication"></span>
  <button type="button" class="tactile pleine" id="suivant">Suivant →</button>
</footer>

<div class="voile masque" id="voile"><div class="panneau" id="panneau"></div></div>

<script src="./donnees.js"></script>
<script src="./stock.js"></script>
<script src="./moteur.js"></script>
<script src="./palette-locale.js"></script>
<script src="./fiche.js"></script>
<script src="./ia.js"></script>
<script src="./salon.js"></script>
</body>
</html>
