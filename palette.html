<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="palette_titre">Ma palette — Le Parfum des émotions</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./salon.css">
<link rel="stylesheet" href="./palette.css">
<script src="./langue.js"></script>
</head>
<body class="salon palette">

<header class="barre-salon">
  <div class="client">
    <strong style="font-size:19px" data-t="ma_palette">Ma palette</strong>
    <span id="resume-palette"></span>
  </div>
  <div class="actions">
    <div class="langues" role="group" data-t-title="langue_groupe" title="Langue / Language">
      <button type="button" data-langue="fr" lang="fr">FR</button>
      <button type="button" data-langue="en" lang="en">EN</button>
    </div>
    <a class="tactile discret" href="./salon.html" data-t="palette_seance">Séance</a>
    <a class="tactile discret" href="./index.html" data-t="palette_client">Page client</a>
  </div>
</header>

<main>
  <p class="consigne" id="explication"></p>

  <div class="bandeau-outils" id="commandes">
    <button type="button" class="tactile pleine" id="ajouter" data-t="ajouter">+ Ajouter une matière</button>
    <button type="button" class="tactile" id="depuis-liste" data-t="depuis_liste">Coller ma liste</button>
    <button type="button" class="tactile" id="partir-demo" data-t="partir_demo">Partir de la palette de démonstration</button>
    <button type="button" class="tactile" id="exporter" data-t="exporter">Sauvegarder / exporter</button>
    <button type="button" class="tactile" id="importer" data-t="importer">Restaurer une sauvegarde</button>
    <button type="button" class="tactile" id="vider" data-t="vider">Tout effacer</button>
  </div>

  <div id="bilan"></div>

  <div class="filtres" id="filtres">
    <input type="search" id="recherche" placeholder="Chercher une matière…" data-t-placeholder="recherche" autocomplete="off">
    <div class="chips" id="filtre-role"></div>
  </div>

  <div id="liste"></div>
</main>

<div class="voile masque" id="voile"><div class="panneau" id="panneau"></div></div>

<script>
  Langue.brancherBoutons();
  Langue.charger([
    ['textes.js', false], ['donnees.js', false], ['stock.js', true], ['moteur.js', false],
    ['palette-locale.js', true], ['palette-outils.js', false], ['palette.js', false]
  ]);
</script>
</body>
</html>
