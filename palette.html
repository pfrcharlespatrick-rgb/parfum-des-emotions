<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma palette — Le Parfum des émotions</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./salon.css">
<link rel="stylesheet" href="./palette.css">
</head>
<body class="salon palette">

<header class="barre-salon">
  <div class="client">
    <strong style="font-size:19px">Ma palette</strong>
    <span id="resume-palette"></span>
  </div>
  <div class="actions">
    <a class="tactile discret" href="./salon.html">Séance</a>
    <a class="tactile discret" href="./index.html">Page client</a>
  </div>
</header>

<main>
  <p class="consigne" id="explication"></p>

  <div class="bandeau-outils" id="commandes">
    <button type="button" class="tactile pleine" id="ajouter">+ Ajouter une matière</button>
    <button type="button" class="tactile" id="depuis-liste">Coller ma liste</button>
    <button type="button" class="tactile" id="partir-demo">Partir de la palette de démonstration</button>
    <button type="button" class="tactile" id="exporter">Sauvegarder / exporter</button>
    <button type="button" class="tactile" id="importer">Restaurer une sauvegarde</button>
    <button type="button" class="tactile" id="vider">Tout effacer</button>
  </div>

  <div id="bilan"></div>

  <div class="filtres" id="filtres">
    <input type="search" id="recherche" placeholder="Chercher une matière…" autocomplete="off">
    <div class="chips" id="filtre-role"></div>
  </div>

  <div id="liste"></div>
</main>

<div class="voile masque" id="voile"><div class="panneau" id="panneau"></div></div>

<script src="./donnees.js"></script>
<script src="./stock.js"></script>
<script src="./moteur.js"></script>
<script src="./palette-locale.js"></script>
<script src="./palette-outils.js"></script>
<script src="./palette.js"></script>
</body>
</html>
